name: Deploy batch agent

# 必要なときに、GitHub Actions から手動で実行する
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC で AWS のロールを引き受ける
  contents: read

concurrency:
  group: deploy-batch
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  # アラームのメールの宛先(リポジトリの Variables に ALERT_EMAIL を登録。未設定なら通知なし)
  ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # x86 のランナーで、ARM64 の Docker イメージをビルドするため
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 認証・DB・他のAIエージェントは再デプロイしない
      - run: npm run deploy:batch -- --require-approval never
